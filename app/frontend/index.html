<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HGS Pipeline Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#F5F7FA; }
  * { box-sizing:border-box; }
  body { font-family:Kanit,system-ui,sans-serif; font-weight:300; color:#15283C; }
  a { color:#26476B; text-decoration:none; }
  input, textarea, button { font-family:Kanit,sans-serif; }
  input:focus, textarea:focus { outline:none; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:#C7D2DC; border-radius:8px; }

  #root { min-height:100vh; display:flex; }

  #sidebar { width:252px; flex-shrink:0; background:#15283C; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; }
  #sidebar .brand { padding:14px 20px 10px; display:flex; align-items:center; gap:8px; border-bottom:1px solid rgba(255,255,255,0.08); }
  #sidebar .brand img { height:30px; width:auto; display:block; }
  #sidebar .meta-block { padding:10px 14px 2px; }
  #sidebar .meta-title { font-size:10.5px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:#6F8AA3; padding:0 10px 4px; }
  #sidebar .meta-sub { font-size:11.5px; color:#8FA3B8; padding:0 10px 8px; }
  #nav { flex:1; padding:0 10px; overflow-y:auto; }
  .nav-group { margin-bottom:2px; }
  .nav-group-title { display:flex; align-items:center; justify-content:space-between; font-size:10.5px; font-weight:600; letter-spacing:.13em; text-transform:uppercase; color:#54708A; padding:7px 10px; cursor:pointer; user-select:none; border-radius:6px; }
  .nav-group-title:hover { color:#8FA3B8; }
  .nav-group-title .chevron { font-size:9px; }
  .nav-group-items { padding-bottom:4px; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:8px; cursor:pointer; font-size:13.5px; margin-bottom:1px; }
  .nav-item:hover { background:#1E344A; }
  .nav-item .icon { font-size:15px; width:18px; text-align:center; flex-shrink:0; }
  #ask-cta-wrap { padding:10px 10px 12px; border-top:1px solid rgba(255,255,255,0.08); }
  #ask-cta { display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px; cursor:pointer; border:1.5px solid #ABCF02; }
  #ask-cta:hover { background:#233C56; }
  #ask-cta .title { font-size:13.5px; font-weight:500; color:#ABCF02; line-height:1.2; }
  #ask-cta .sub { font-size:10.5px; color:#8FA3B8; line-height:1.2; }

  #main { flex:1; min-width:0; padding:28px 36px 60px; }
  .eyebrow { font-size:11px; font-weight:500; letter-spacing:.16em; text-transform:uppercase; color:#3D9B99; margin-bottom:6px; }
  h1 { font-weight:600; font-size:28px; margin:0 0 6px; letter-spacing:-0.01em; }
  .page-sub { margin:0; font-size:14px; color:#5C6D72; max-width:760px; }

  .card { background:#FFFFFF; border-radius:16px; box-shadow:0 1px 3px rgba(21,40,60,0.06); }
  .grid { display:grid; gap:16px; }

  .chip { padding:8px 14px; border-radius:999px; font-size:12px; font-weight:500; cursor:pointer; background:#FFFFFF; color:#5C6D72; border:1.5px solid #E3E8EE; }
  .chip.active { background:#26476B; color:#FFFFFF; border-color:#26476B; }

  .filter-flyout { position:relative; display:inline-block; }
  .filter-btn { padding:8px 14px; border-radius:999px; font-size:12px; font-weight:500; cursor:pointer; background:#FFFFFF; color:#5C6D72; border:1.5px solid #E3E8EE; display:inline-flex; align-items:center; gap:6px; }
  .filter-btn.active { background:#26476B; color:#FFFFFF; border-color:#26476B; }
  .filter-btn .caret { font-size:8px; opacity:.8; }
  .filter-menu { position:absolute; top:calc(100% + 6px); left:0; background:#FFFFFF; border:1px solid #E3E8EE; border-radius:10px; box-shadow:0 8px 24px rgba(21,40,60,0.14); z-index:30; min-width:170px; max-height:260px; overflow-y:auto; padding:6px; }
  .filter-menu-item { padding:8px 12px; border-radius:6px; font-size:12.5px; color:#15283C; cursor:pointer; white-space:nowrap; }
  .filter-menu-item:hover { background:#F1F3F8; }
  .filter-menu-item.active { color:#26476B; font-weight:600; background:#F1F3F8; }
  .filter-menu-clear { font-style:italic; color:#5C6D72; border-bottom:1px solid #EEF1F5; margin-bottom:4px; padding-bottom:9px; }
  .filter-menu-check { display:flex; align-items:center; gap:8px; }
  .filter-menu-check.checked { color:#26476B; font-weight:500; }
  .filter-menu-check .check-box { width:14px; height:14px; flex-shrink:0; border:1.5px solid #C7D2DC; border-radius:3px; display:inline-flex; align-items:center; justify-content:center; font-size:10px; line-height:1; color:#26476B; }
  .filter-menu-check.checked .check-box { border-color:#26476B; background:#EAF1FA; }

  table.data-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.data-table th { text-align:left; font-size:11px; font-weight:600; color:#8393A0; text-transform:uppercase; letter-spacing:.04em; padding:12px 20px; background:#F7F9FB; white-space:nowrap; }
  table.data-table th.sortable { cursor:pointer; user-select:none; }
  table.data-table th.sortable:hover { color:#26476B; }
  table.data-table th.sortable.active { color:#26476B; }
  table.data-table th .sort-arrow { margin-left:4px; font-size:9px; }
  table.data-table td { padding:13px 20px; border-top:1px solid #F0F2F5; }
  table.data-table tbody tr:hover { background:#FAFBFD; }
  table.data-table tbody tr.row-link { cursor:pointer; }
  .num { text-align:right; }
  .badge { display:inline-block; font-size:11px; font-weight:500; padding:3px 9px; border-radius:999px; }

  .bar-row { margin-bottom:12px; }
  .bar-row .bar-label { display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px; }
  .bar-track { height:9px; background:#EEF1F5; border-radius:5px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:5px; }

  input.text-input { padding:11px 16px; border-radius:10px; border:1.5px solid #E3E8EE; font-size:13.5px; color:#15283C; background:#FFFFFF; }

  #app-loading { padding:60px; text-align:center; color:#8393A0; }
</style>
</head>
<body>
<div id="root">
  <div id="sidebar">
    <div class="brand"><img src="/assets/hgs-logo-white.svg" alt="HGS"></div>
    <div class="meta-block">
      <div class="meta-title">FY27 Pipeline</div>
      <div class="meta-sub" id="meta-refreshed">No data yet</div>
    </div>
    <div id="nav"></div>
    <div id="ask-cta-wrap">
      <div id="ask-cta">
        <span style="font-size:16px">&#10024;</span>
        <div>
          <div class="title">Ask a Question</div>
          <div class="sub">Natural-language analytics</div>
        </div>
      </div>
    </div>
  </div>
  <div id="main"><div id="app-loading">Loading&hellip;</div></div>
</div>
<script src="/app.js"></script>
</body>
</html>
